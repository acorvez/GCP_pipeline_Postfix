---
- name: Install OpenVPN packages
  apt:
    name:
      - openvpn
      - easy-rsa
      - iptables-persistent
      - net-tools
    state: present
    update_cache: yes

- name: Create OpenVPN directories
  file:
    path: "{{ item }}"
    state: directory
    mode: 0700
  with_items:
    - /etc/openvpn/server
    - /etc/openvpn/client
    - /etc/openvpn/easyrsa

- name: Copy EasyRSA to OpenVPN directory
  shell: "cp -r /usr/share/easy-rsa/* /etc/openvpn/easyrsa/"
  args:
    creates: /etc/openvpn/easyrsa/vars

- name: Set up EasyRSA vars
  template:
    src: vars.j2
    dest: /etc/openvpn/easyrsa/vars
    mode: 0600

- name: Initialize PKI
  shell: |
    cd /etc/openvpn/easyrsa
    . ./vars
    ./easyrsa --batch init-pki
  args:
    creates: /etc/openvpn/easyrsa/pki

- name: Build CA
  shell: |
    cd /etc/openvpn/easyrsa
    . ./vars
    ./easyrsa --batch build-ca nopass
  args:
    creates: /etc/openvpn/easyrsa/pki/ca.crt

- name: Generate server key
  shell: |
    cd /etc/openvpn/easyrsa
    . ./vars
    ./easyrsa --batch build-server-full server nopass
  args:
    creates: /etc/openvpn/easyrsa/pki/issued/server.crt

- name: Generate DH parameters
  shell: |
    cd /etc/openvpn/easyrsa
    . ./vars
    ./easyrsa gen-dh
  args:
    creates: /etc/openvpn/easyrsa/pki/dh.pem

- name: Generate TLS key
  shell: |
    cd /etc/openvpn
    openvpn --genkey --secret /etc/openvpn/server/ta.key
  args:
    creates: /etc/openvpn/server/ta.key

- name: Copy certificates to OpenVPN server directory
  copy:
    src: "/etc/openvpn/easyrsa/pki/{{ item.src }}"
    dest: "/etc/openvpn/server/{{ item.dest }}"
    remote_src: yes
    mode: 0600
  with_items:
    - { src: "ca.crt", dest: "ca.crt" }
    - { src: "issued/server.crt", dest: "server.crt" }
    - { src: "private/server.key", dest: "server.key" }
    - { src: "dh.pem", dest: "dh.pem" }

- name: Generate client certificate
  shell: |
    cd /etc/openvpn/easyrsa
    . ./vars
    ./easyrsa --batch build-client-full client nopass
  args:
    creates: /etc/openvpn/easyrsa/pki/issued/client.crt

- name: Create basic client config
  template:
    src: client.ovpn.j2
    dest: /etc/openvpn/client/client.ovpn
    mode: 0600

- name: Insert CA certificate into client config
  shell: |
    echo "<ca>" > /tmp/ca.txt
    cat /etc/openvpn/easyrsa/pki/ca.crt >> /tmp/ca.txt
    echo "</ca>" >> /tmp/ca.txt
    sed -i '/<ca>/,/<\/ca>/!b;//{//!d;}' /etc/openvpn/client/client.ovpn
    sed -i '/<ca>/ r /tmp/ca.txt' /etc/openvpn/client/client.ovpn
    rm /tmp/ca.txt
  args:
    executable: /bin/bash

- name: Insert client certificate into client config
  shell: |
    echo "<cert>" > /tmp/cert.txt
    cat /etc/openvpn/easyrsa/pki/issued/client.crt >> /tmp/cert.txt
    echo "</cert>" >> /tmp/cert.txt
    sed -i '/<cert>/,/<\/cert>/!b;//{//!d;}' /etc/openvpn/client/client.ovpn
    sed -i '/<cert>/ r /tmp/cert.txt' /etc/openvpn/client/client.ovpn
    rm /tmp/cert.txt
  args:
    executable: /bin/bash

- name: Insert client key into client config
  shell: |
    echo "<key>" > /tmp/key.txt
    cat /etc/openvpn/easyrsa/pki/private/client.key >> /tmp/key.txt
    echo "</key>" >> /tmp/key.txt
    sed -i '/<key>/,/<\/key>/!b;//{//!d;}' /etc/openvpn/client/client.ovpn
    sed -i '/<key>/ r /tmp/key.txt' /etc/openvpn/client/client.ovpn
    rm /tmp/key.txt
  args:
    executable: /bin/bash

- name: Insert TLS key into client config
  shell: |
    echo "<tls-auth>" > /tmp/ta.txt
    cat /etc/openvpn/server/ta.key >> /tmp/ta.txt
    echo "</tls-auth>" >> /tmp/ta.txt
    sed -i '/<tls-auth>/,/<\/tls-auth>/!b;//{//!d;}' /etc/openvpn/client/client.ovpn
    sed -i '/<tls-auth>/ r /tmp/ta.txt' /etc/openvpn/client/client.ovpn
    rm /tmp/ta.txt
  args:
    executable: /bin/bash

- name: Create OpenVPN server config
  template:
    src: server.conf.j2
    dest: /etc/openvpn/server.conf
    mode: 0644

- name: Create client config
  template:
    src: client.ovpn.j2
    dest: /etc/openvpn/client/client.ovpn
    mode: 0600

- name: Enable IPv4 forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: 1
    state: present
    reload: yes

- name: Setup iptables for NAT
  iptables:
    table: nat
    chain: POSTROUTING
    out_interface: ens4  # This might need to be adjusted based on your GCP network interface
    jump: MASQUERADE
    state: present

- name: Save iptables rules
  shell: iptables-save > /etc/iptables/rules.v4
  args:
    creates: /etc/iptables/rules.v4

- name: Enable and start OpenVPN service
  systemd:
    name: openvpn@server
    state: started
    enabled: yes
