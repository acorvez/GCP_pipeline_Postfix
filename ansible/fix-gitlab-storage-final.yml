---
- hosts: gitlab
  become: true
  tasks:
    - name: Stop GitLab services
      command: gitlab-ctl stop
      ignore_errors: yes

    - name: Create alternate GitLab data directory with proper permissions
      file:
        path: "/opt/gitlab-data/{{ item }}"
        state: directory
        owner: git
        group: git
        mode: 0755
        recurse: yes
      with_items:
        - git-data
        - git-data/repositories
        - gitlab-rails
        - gitlab-rails/uploads
        - gitlab-rails/shared
        - gitlab-rails/backups
        - postgresql

    - name: Update GitLab configuration to use alternate path
      copy:
        content: |
          external_url 'http://gitlab.example.com'
          letsencrypt['enable'] = false
          
          # Configuration des répertoires de données
          git_data_dirs({
            "default" => {
              "path" => "/opt/gitlab-data/git-data"
            }
          })
          
          # Configuration PostgreSQL
          postgresql['data_dir'] = "/opt/gitlab-data/postgresql"
          
          # Configuration Rails
          gitlab_rails['uploads_directory'] = "/opt/gitlab-data/gitlab-rails/uploads"
          gitlab_rails['shared_path'] = "/opt/gitlab-data/gitlab-rails/shared"
          gitlab_rails['backup_path'] = "/opt/gitlab-data/gitlab-rails/backups"
          
          # Prometheus (pas Grafana)
          prometheus['enable'] = true
          
          # Configuration des sauvegardes
          gitlab_rails['backup_keep_time'] = 604800
        dest: /etc/gitlab/gitlab.rb
        mode: 0600

    - name: Clear any stale configuration
      shell: |
        rm -rf /var/opt/gitlab/gitaly/*
        rm -rf /var/opt/gitlab/git-data || true
        rm -f /var/opt/gitlab/.gitconfig
      ignore_errors: yes

    - name: Reconfigure GitLab with new paths
      command: gitlab-ctl reconfigure
      environment:
        GITLAB_SKIP_STORAGE_VALIDATION: "true"
      ignore_errors: yes
      
    - name: Start GitLab services
      command: gitlab-ctl start
      ignore_errors: yes
