---
- hosts: gitlab
  become: true
  tasks:
    - name: Wait for GitLab to be fully operational
      uri:
        url: http://localhost
        status_code: [200, 302]
        timeout: 5
      register: gitlab_status
      until: gitlab_status.status == 200 or gitlab_status.status == 302
      retries: 30
      delay: 10
      ignore_errors: yes
      
    - name: Get GitLab root password
      shell: |
        if [ -f /etc/gitlab/initial_root_password ]; then
          cat /etc/gitlab/initial_root_password | grep Password | awk '{print }'
        else
          echo "{{ gitlab_root_password }}"
        fi
      register: gitlab_root_pass
      changed_when: false
      
    - name: Create directory for GitLab API token
      file:
        path: /tmp/gitlab
        state: directory
        mode: 0755
        
    - name: Create personal access token
      shell: |
        curl --request POST --header "PRIVATE-TOKEN: {{ gitlab_root_pass.stdout }}"           --data "name=jenkins-token&scopes[]=api&scopes[]=read_repository&scopes[]=write_repository"           http://localhost/api/v4/users/1/personal_access_tokens | grep -o '"id":[0-9]*,"token":"[^"]*"' | awk -F'"' '{print }'
      register: gitlab_token
      changed_when: false
      ignore_errors: true
      
    - name: Save token to file
      copy:
        content: "{{ gitlab_token.stdout }}"
        dest: /tmp/gitlab/token
        mode: 0600
      when: gitlab_token.stdout != ""
      
    - name: Create postfix-config project
      shell: |
        curl --request POST --header "PRIVATE-TOKEN: {{ gitlab_token.stdout }}"           --data "name=postfix-config&description=Configuration Postfix pour notre infrastructure"           http://localhost/api/v4/projects
      ignore_errors: true
      when: gitlab_token.stdout != ""
